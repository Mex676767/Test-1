name = "ctmaprapp"
main = "functions/_worker.js"
compatibility_date = "2026-01-01"
# Required so _lib/lark.js and _lib/livechat.js can read process.env at all
# -- without this flag Workers has no process.env whatsoever.
compatibility_flags = ["nodejs_compat"]

# This project was created as a Worker, not classic Pages -- static assets
# (index.html, app.js, style.css) are served through this binding, with
# functions/_worker.js (the `main` entry above) routing API calls to the
# right handler first and falling through to this for everything else.
[assets]
directory = "."
binding = "ASSETS"
