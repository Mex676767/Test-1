<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="widget-release" content="development" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="style.css?v=20261008-4" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Console</span>
      </div>
      <div class="topbar-actions">
        <button id="settingsBtn" class="icon-btn" title="Agent settings" aria-label="Settings">⚙</button>
        <button id="themeToggle" class="theme-toggle" title="Switch appearance" aria-label="Switch appearance">
          <span class="theme-icon sun">☀</span>
          <span class="theme-icon moon">☾</span>
        </button>
        <button id="refreshBtn" class="icon-btn" title="Refresh active chats" aria-label="Refresh">⟳</button>
      </div>
    </div>
    <span id="agentBadge" class="agent-badge unset">⚠︎ No agent set</span>
  </header>

  <nav id="mainTabs" class="main-tabs" aria-label="App sections">
    <button type="button" id="retentionTab" class="main-tab active" data-main-tab="customer">Retention</button>
    <button type="button" id="blastTab" class="main-tab" data-main-tab="blast" hidden>Blast</button>
    <button type="button" id="ticketsTab" class="main-tab" data-main-tab="tickets" hidden>Tickets</button>
    <button type="button" id="knowledgeTab" class="main-tab" data-main-tab="knowledge" hidden>Knowledge</button>
  </nav>

  <div id="statusBar" class="status-bar hidden"></div>

  <!-- Every chat this browser knows about that closed without ever being
       completed (missing Inquiry/Status/etc.) -- not just whichever one
       happens to be the currently-focused card, since LiveChat's SDK only
       ever shows this widget one chat at a time. See renderNeedsAttentionPanel. -->
  <div id="needsAttentionPanel" class="needs-attention-panel hidden">
    <button type="button" id="needsAttentionToggle" class="needs-attention-toggle">
      <span id="needsAttentionCount"></span>
      <span class="na-caret">▾</span>
    </button>
    <div id="needsAttentionList" class="needs-attention-list hidden"></div>
  </div>

  <main id="chatList" class="chat-list"></main>
  <section id="blastView" class="blast-view" hidden>
    <iframe data-src="/blast/index.html?v=20261007-4" loading="lazy" title="LiveChat Engagement"></iframe>
  </section>
  <section id="knowledgeView" class="knowledge-view" hidden>
    <iframe data-src="/knowledge/index.html" loading="lazy" title="CS Learning Assistant"></iframe>
  </section>

  <!-- LiveChat Agent App SDK — provides the currently active chat (customer
       name, chat ID) when this widget is actually running inside LiveChat's
       Details sidebar. Loaded before app.js so `LiveChat` is defined by the
       time app.js checks for it; harmless (just unused) when previewed
       standalone outside LiveChat, or if this CDN fails to load. -->
  <script src="vendor/livechat-agentapp-1.16.0.min.js"></script>
  <script src="app.js?v=20261008-16"></script>
  <script src="deployment-refresh.js?v=20261007-1"></script>
</body>
</html>
