<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blast delivery</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;color:#f3f4f6;background:#101217}
    body{max-width:680px;margin:auto;padding:24px}h1{font-size:22px;margin:0 0 6px}
    p{color:#aeb6c7;margin:0 0 20px}.status{padding:16px;border:1px solid #374151;border-radius:12px;background:#181c25}
    #progress{display:block;color:#aeb6c7;margin-top:6px}nav{display:flex;gap:10px;margin:16px 0}
    button{font:inherit;border:1px solid #4b5563;border-radius:8px;padding:8px 16px;background:#252c3b;color:inherit;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}#log{padding-left:20px;overflow-wrap:anywhere}.err{color:#ff9292}.ok{color:#68dfbd}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <h1>Blast delivery</h1>
  <p>Keep this window open until the queue finishes. You can switch chats or reload the LiveChat widget.</p>
  <div class="status"><strong id="status">Waiting for queue…</strong><span id="progress"></span></div>
  <nav><button id="pause" disabled>Pause</button><button id="stop" disabled>Stop</button></nav>
  <ol id="log" aria-live="polite"></ol>
  <script src="web-adapter.js?v=20261006-1"></script>
  <script src="runner.js?v=20261006-1"></script>
</body>
</html>
